<div class="container mt-4">
  <h2>Issue Academic Certificate</h2>

  <form [formGroup]="certificateForm" (ngSubmit)="onSubmit()" class="needs-validation">
    <div class="mb-3">
      <label for="studentId" class="form-label">Student ID</label>
      <input type="number" id="studentId" formControlName="studentId" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="courseId" class="form-label">Course ID</label>
      <input type="number" id="courseId" formControlName="courseId" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="serialNumber" class="form-label">Serial Number</label>
      <input type="text" id="serialNumber" formControlName="serialNumber" class="form-control" placeholder="e.g. CERT-2026-001" />
    </div>

    <button type="submit" [disabled]="certificateForm.invalid" class="btn btn-primary">
      Issue Certificate
    </button>
  </form>

  <!-- Display Issued Certificate Card with HATEOAS Links -->
  <div *ngIf="issuedCertificate" class="card mt-4 p-3">
    <h4>Certificate Details</h4>
    <p><strong>ID:</strong> {{ issuedCertificate.id }}</p>
    <p><strong>Serial:</strong> {{ issuedCertificate.serialNumber }}</p>
    <p><strong>Student:</strong> {{ issuedCertificate.studentName }}</p>
    <p><strong>Course:</strong> {{ issuedCertificate.courseTitle }}</p>
    <p><strong>Issued At:</strong> {{ issuedCertificate.issuedAt | date:'medium' }}</p>
  </div>
</div>
