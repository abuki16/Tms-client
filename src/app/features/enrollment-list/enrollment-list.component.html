<h2>Enrollment Records</h2>

@if (store.isLoading()) {
  <div>Loading enrollments...</div>
}

@if (store.error()) {
  <div class="error-message">{{ store.error() }}</div>
}

<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

  <!-- Student Name Column -->
  <ng-container matColumnDef="studentName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Student</th>
    <td mat-cell *matCellDef="let row"> {{ row.studentName }} </td>
  </ng-container>

  <!-- Course Name Column -->
  <ng-container matColumnDef="courseName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Course</th>
    <td mat-cell *matCellDef="let row"> {{ row.courseName }} </td>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
    <td mat-cell *matCellDef="let row"> {{ row.status }} </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      @if (row.status === 'Pending') {
        <button mat-button color="primary" (click)="store.approveEnrollment(row.id)">Approve</button>
      }
    </td>
  </ng-container>

  <!-- Row Definitions -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<!-- Paginator -->
<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
